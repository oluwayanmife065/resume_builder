[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.1.0"
description = "Local, privacy-first career agent for ATS-tailored resumes and cover letters"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "ollama>=0.3.0",
    "jinja2>=3.1.4",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


